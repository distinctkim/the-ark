<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — The Ark</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #f4f7fc; color: #2d3748; margin: 0;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    .wrap { max-width: 480px; padding: 2rem; }
    h1 { font-family: 'Playfair Display', serif; color: #1a2e4a; font-size: 5rem; margin: 0; }
    h2 { font-family: 'Playfair Display', serif; color: #1a2e4a; margin: 0.5rem 0 1rem; }
    p  { color: #718096; margin-bottom: 2rem; }
    a  { display: inline-block; background: #2abaad; color: #fff; padding: 0.7rem 1.75rem;
         border-radius: 8px; font-weight: 600; text-decoration: none; }
    a:hover { background: #1e9589; }
  </style>
</head>
<body>
  <div class="wrap">
    <div style="font-size:4rem;">🧹</div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Sorry, that page doesn't exist. Let us sweep you back home!</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
